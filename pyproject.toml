[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xstate-statemachine"
version = "0.8.0"
authors = [
  { name="Basil T T", email="tt.basil@gmail.com" },
]
description = "A robust Python library for parsing and running XState JSON state machines."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# 📦 Optional extras.
#
# 🏛️ The core library has ZERO runtime dependencies, and that stays true.
#    Code generation formats its output with black and isort WHEN THEY ARE
#    AVAILABLE; without them the emitted code is still valid and faithful,
#    just not line-wrapped. Installing this extra makes generated code
#    match what the project's own linters expect:
#
#        pip install "xstate-statemachine[format]"
[project.optional-dependencies]
format = [
    "black>=24.0",
    "isort>=5.13",
]

[project.urls]
Homepage = "https://github.com/basiltt/xstate-statemachine"
"Bug Tracker" = "https://github.com/basiltt/xstate-statemachine/issues"

[project.scripts]
xsm = "xstate_statemachine.cli.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "pre-commit>=4.0.0",
    "mypy>=1.14",
]
lint = [
    "black>=25.1.0",
    "flake8>=7.1.0",
    "flake8-isort>=6.1.0",
    "mypy>=1.14",
]
test = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xstate_statemachine"]

# 📦 Source distribution contents.
#
# 🏛️ Architecture decision: allowlist, not denylist. Hatchling's default sdist
#    inclusion is broad, so internal working files land in the tarball unless
#    something stops them — `.claude/` review notes were being published to
#    PyPI this way. A denylist only excludes what we thought to name; naming
#    what SHIPS means a new stray directory is excluded by default rather than
#    silently packaged into an immutable release artifact.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/AGENTS.md",
    "/pyproject.toml",
]

# 📐 `/docs` is included wholesale above, so carve out the internal planning
#    artifacts explicitly. Relying on the .gitignore entry alone would make
#    packaging correctness depend on hatchling's VCS-ignore behaviour; stating
#    it here keeps the tarball's contents readable from this file alone.
exclude = [
    "/docs/superpowers",
]

# 📦 PEP 561: ship the marker so type checkers actually consume the inline
#    annotations. The `Typing :: Typed` classifier promised this already, so
#    without the file the claim was false and every hint was invisible to mypy.
[tool.hatch.build.targets.wheel.force-include]
"src/xstate_statemachine/py.typed" = "xstate_statemachine/py.typed"

[tool.mypy]
# 🧷 The library ships `py.typed`; these are the settings under which its
#    own source is kept at zero errors (enforced by tests/test_type_safety.py
#    and the CI lint job). `strict` is the goal for 1.0; the incremental
#    flags below are the ones already satisfied.
# 🐍 No `python_version` pin: mypy 2.x refuses 3.9 (it is past EOL for the
#    checker) while our runtime floor is still 3.9. The 3.9 CI test job
#    IS the compatibility gate; here we check against the checker's own
#    default, which is the interpreter running it.
files = ["src/xstate_statemachine"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true
check_untyped_defs = true

[tool.black]
line-length = 79
target-version = ['py39', 'py310', 'py311', 'py312', 'py313', 'py314']
include = '\.pyi?$'
exclude = '''
/(\n    \.git\n  | \.venv\n  | venv\n  | __pycache__\n  | build\n  | dist\n  | \.pytest_cache\n  | \.env\n)/
'''

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/xstate_statemachine"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
# 📏 Repository rule: minimum 90% line+branch coverage. `pytest --cov` fails
#    below this locally and in CI alike. Ratchet up, never down.
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
