# xsm-check -- validate XState machine JSON and keep generated code current.
#
#   - uses: basiltt/xstate-statemachine@v0.14.0
#     with:
#       files: "machines/**/*.json"
#       generated-dir: generated          # optional: runs `xsm gt --check`
#       gt-args: "-t pythonic-class"      # the flags you generate with
#
# Composite: no container, no token, no network beyond `pip install`.
name: xsm-check
description: >-
  Validate XState machine JSON with xstate-statemachine (`xsm validate`) and
  fail when code generated by `xsm gt` is stale.
author: basiltt
branding:
  icon: check-circle
  color: blue

inputs:
  files:
    description: Glob (bash globstar) of machine JSON files to check.
    required: true
  generated-dir:
    description: >-
      Directory holding code generated by `xsm gt`. When set, runs
      `xsm gt --check <files> -o <generated-dir> <gt-args>`.
    required: false
    default: ""
  gt-args:
    description: Extra `xsm gt` flags used to generate the code (e.g. `-t pythonic-class`).
    required: false
    default: ""
  python-version:
    description: Python to run xsm under.
    required: false
    default: "3.13"
  package:
    description: pip requirement to install (pin it, e.g. `xstate-statemachine==0.14.0`).
    required: false
    default: xstate-statemachine

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install xstate-statemachine
      shell: bash
      env:
        XSM_PACKAGE: ${{ inputs.package }}
      run: python -m pip install --disable-pip-version-check "$XSM_PACKAGE"

    - name: xsm validate
      shell: bash
      env:
        XSM_FILES: ${{ inputs.files }}
      run: |
        shopt -s globstar nullglob
        # 📝 Word-splitting of the glob is intended; the input is a pattern.
        files=( $XSM_FILES )
        if [ ${#files[@]} -eq 0 ]; then
          echo "::error::xsm-check: no files match '$XSM_FILES'"
          exit 1
        fi
        xsm validate --plain "${files[@]}"

    - name: xsm gt --check
      if: inputs.generated-dir != ''
      shell: bash
      env:
        XSM_FILES: ${{ inputs.files }}
        XSM_OUT: ${{ inputs.generated-dir }}
        XSM_GT_ARGS: ${{ inputs.gt-args }}
      run: |
        shopt -s globstar nullglob
        files=( $XSM_FILES )
        xsm gt --check --plain "${files[@]}" -o "$XSM_OUT" $XSM_GT_ARGS
