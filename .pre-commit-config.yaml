repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-json
      - id: end-of-file-fixer
      - id: name-tests-test
        args: [ "--django" ]
        # Support modules that live under tests/ but are not test files:
        # the Django test project, broker fakes, fixtures, repro scripts.
        exclude: |
          (?x)^tests/(
            contrib/django/(bootstrap\.py|project/)
            | contrib/brokers/fakes\.py
            | contrib/starlette/_support\.py
            | eda/contract\.py
            | fixtures/
            | regression/candleviewer/repro_
            | tests_cli/(base|fixtures|golden)\.py
          )
      - id: check-added-large-files
        args: [ '--maxkb=3000' ]
      - id: requirements-txt-fixer
      - id: check-yaml
      - id: check-merge-conflict


  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
        language_version: python3.14
        types: [ python ]
        exclude: |
          (?x)^(
            \.audit/
            | pytest_cache
            | \.env
            | pytest\.ini
            | venv
            | requirements\.txt
            | \.idea
            | \.git
          )
        args: [ "--line-length=79" ]

  - repo: https://github.com/pycqa/flake8
    rev: 7.5.0
    hooks:
      - id: flake8
        additional_dependencies: [ flake8-isort==7.1.0 ]
        exclude: ^\.audit/
        args: [ "--max-complexity=35",
                "--select=B,C,E,F,W,T4,B9",
                "--ignore=E203,E266,E501,W503,F403,F401,E402" ]
