# /.github/workflows/ci.yml
# -----------------------------------------------------------------------------
# 🤖 Continuous Integration
# -----------------------------------------------------------------------------
# Runs on every push and pull request targeting `main`.
#
# 🏛️ Architecture decision: the job graph is deliberately split so a failure
# tells you *what kind* of thing broke without reading logs:
#
#   lint     → style/format only (fast, fails in ~30s) + banned-deserialiser grep
#   test     → the suite across the full supported interpreter matrix
#   coverage → one authoritative coverage measurement + threshold gate
#   build    → the distribution actually packages and imports
#   core-zero-dep → the library imports with every third-party import blocked
#   contrib  → one cell per optional extra, installing ONLY that extra
#
# 📌 Third-party actions are pinned to commit SHAs (tag in a trailing
#    comment) so a moved tag cannot change what runs here (X0.14, #303).
#
# `lint` is NOT a gate for `test`. They run in parallel because a formatting
# nit should never hide a real test failure — you want both results from one
# push, not one after the other.
#
# The matrix spans every version advertised in `pyproject.toml`
# (`requires-python = ">=3.9"` plus the trove classifiers). If a version is
# dropped from the package metadata, drop it here too — a claim of support
# that is not exercised by CI is just a hope.
# -----------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 🖱️ Allow maintainers to trigger a run by hand from the Actions tab.
  workflow_dispatch:
  # 📏 #307: only the perf job runs on the nightly schedule.
  schedule:
    - cron: "17 3 * * *"

# 🚦 Cancel superseded runs on the same ref. A force-push should not leave
#    three stale jobs burning minutes to report on code nobody will merge.
# 📏 #307: the nightly perf run gets its own group so it can neither cancel
#    nor be cancelled by a push to `main` that lands at the same moment.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly-perf' || github.ref }}
  cancel-in-progress: true

# 🔒 Least privilege: CI only ever needs to read the repository.
permissions:
  contents: read

env:
  # 🎨 Keep tool output readable in the Actions log viewer.
  FORCE_COLOR: "1"
  PYTHONUTF8: "1"

jobs:
  # ---------------------------------------------------------------------------
  # 🎨 Style & Formatting
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (black + flake8 + mypy)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: 📦 Install lint tooling
        # 📌 Pinned to the same versions as .pre-commit-config.yaml so a local
        #    `pre-commit run` and CI can never disagree about formatting.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "black==26.1.0" "flake8==7.3.0" "flake8-isort==7.0.0" "mypy>=1.14"

      - name: 🎨 Check formatting (black)
        run: black --check --diff src/ tests/ benchmarks/ scripts/ --line-length=79

      - name: 🔍 Lint (flake8)
        # ⚙️ Flags mirror .pre-commit-config.yaml exactly.
        run: |
          flake8 src/ tests/ benchmarks/ scripts/ \
            --max-complexity=35 \
            --select=B,C,E,F,W,T4,B9 \
            --ignore=E203,E266,E501,W503,F403,F401,E402

      - name: 🧷 Type-check the library (mypy)
        # 🏛️ The package ships `py.typed`. Zero errors here is what makes
        #    that claim true; tests/test_type_safety.py additionally checks
        #    that USER code type-checks with the right errors and no false
        #    positives.
        run: python -m mypy

      - name: 🚫 Ban unsafe deserialisers in the library
        # 🛡️ X0.4 (#303): snapshots and broker envelopes are untrusted input
        #    and are JSON only. `pickle`, `yaml.load`, `eval`/`exec` and
        #    `jsonpickle` must never appear under src/. The CLI's stdlib
        #    allow-list legitimately *names* "pickle" as a module name string;
        #    that file is excluded by path, not by pattern. The generator's
        #    self-verification `exec` of its OWN output is the one sanctioned
        #    use and carries an `# xsm:allow-exec` marker.
        run: |
          if grep -rnE '^\s*(import|from)\s+(pickle|jsonpickle|shelve|marshal)\b|yaml\.(load|unsafe_load)\(|\beval\(|\bexec\(' \
               --include='*.py' src/ --exclude-dir=__pycache__ \
               | grep -v 'src/xstate_statemachine/cli/utils.py' \
               | grep -v 'xsm:allow-exec'; then
            echo '::error::unsafe deserialiser or eval/exec found under src/ (X0.4)'; exit 1
          fi
          echo "no banned deserialisers"

  # ---------------------------------------------------------------------------
  # 🪶 Zero-dependency guard
  # ---------------------------------------------------------------------------
  core-zero-dep:
    name: Core is zero-dependency
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: 📦 Bare install -- the package and pytest, nothing else
        # 🏛️ Programme invariant #1 (#257/#258): `import xstate_statemachine`
        #    must work with no third-party package present. This job installs
        #    ONLY the library and pytest (no dev group, no extras, no cache
        #    that could smuggle a wheel in) and runs the guard, which blocks
        #    every non-stdlib import in a child interpreter.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=8.3.0"
          python -m pip list

      - name: 🪶 Run the guard
        run: pytest tests/test_zero_dependency.py tests/test_import_surface.py tests/contrib/test_extras_matrix.py -q --no-header

  # ---------------------------------------------------------------------------
  # 🔌 Integration extras matrix
  # ---------------------------------------------------------------------------
  contrib:
    name: Extra [${{ matrix.extra }}] (py${{ matrix.python-version }} / ${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 📝 One cell per extra in `contrib/_registry.py`. Each installs ONLY
        #    its own extra and runs ONLY its own test folder, so a leak
        #    between integrations (fastapi tests passing because django
        #    happened to be installed) is impossible by construction.
        #    Folders that do not exist yet make pytest exit 5 ("no tests
        #    collected"), which is treated as a pass until the owning issue
        #    lands. Windows cells need `shell: bash` for that idiom.
        extra:
          - pydantic
          - observability
          - testing
          - redis
          - sqlalchemy
          - starlette
          - fastapi
          - litestar
          - flask
          - django
          - drf
          - channels
          - celery
          - kafka
          - rabbitmq
          - nats
          - sqs
          - cloudevents
          - agents
        os: [ubuntu-latest]
        python-version: ["3.13"]
        include:
          # Windows spot checks for the extras most likely to be used there.
          - { extra: pydantic, os: windows-latest, python-version: "3.13" }
          - { extra: fastapi, os: windows-latest, python-version: "3.13" }
          - { extra: django, os: windows-latest, python-version: "3.13" }
          - { extra: sqlalchemy, os: windows-latest, python-version: "3.13" }
          # Oldest interpreter for the two heaviest surfaces.
          - { extra: django, os: ubuntu-latest, python-version: "3.9" }
          - { extra: fastapi, os: ubuntu-latest, python-version: "3.9" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 📦 Install the library with ONLY this extra
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[${{ matrix.extra }}]" "pytest>=8.3.0" "pytest-socket>=0.7"
          # 🟥 #306: the [redis] cell runs its contract suites against an
          #    in-process fakeredis (Lua enabled); no service container.
          if [ "${{ matrix.extra }}" = "redis" ]; then python -m pip install "fakeredis[lua]>=2.20"; fi
          # 🌐 #275: starlette.testclient and the ASGI streaming tests need httpx.
          if [ "${{ matrix.extra }}" = "starlette" ]; then python -m pip install "httpx>=0.24"; fi
          python -m pip list

      - name: 🧪 Run this extra's tests
        shell: bash
        # 🌐 X0.16 (#303): no test may reach the network by accident.
        # 📝 A folder that does not exist yet is a placeholder cell: run just
        #    the shared contract test (which skips cleanly when there is no
        #    subpackage) so the cell still proves the extra installs.
        run: |
          targets="tests/contrib/test_extras_matrix.py"
          if [ -d "tests/contrib/${{ matrix.extra }}" ]; then
            targets="tests/contrib/${{ matrix.extra }} $targets"
          else
            echo "no tests for [${{ matrix.extra }}] yet -- placeholder cell"
          fi
          pytest $targets -q --no-header --disable-socket --allow-hosts=127.0.0.1,::1

  # ---------------------------------------------------------------------------
  # 🔒 Supply chain (X0.14, #303)
  # ---------------------------------------------------------------------------
  audit:
    name: pip-audit [all]
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: 📦 Install with every extra
        run: |
          python -m pip install --upgrade pip
          # `[all]` is the union of every SHIPPED extra (pyproject.toml).
          python -m pip install -e ".[all]" pip-audit

      - name: 🔍 Audit the resolved environment
        # 📝 X0.14: known-vulnerable transitive dependencies of an extra
        #    are OUR problem to surface. `--strict` fails on any finding;
        #    `--ignore-vuln` with a justification comment is the only
        #    accepted way past a finding that does not apply.
        run: python -m pip_audit --strict --progress-spinner off

  # ---------------------------------------------------------------------------
  # 🧪 Test Matrix
  # ---------------------------------------------------------------------------
  test:
    name: Test (py${{ matrix.python-version }} / ${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      # 🔬 Never stop the whole matrix on one red cell. A failure that is
      #    specific to one interpreter or OS is exactly the signal we want,
      #    and cancelling siblings hides whether it is isolated or systemic.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        # 🪟🍎 Spot-check the other platforms on the oldest and newest
        #     supported interpreters. The library is pure Python with no
        #     compiled deps, but it uses threads (SyncInterpreter) and asyncio,
        #     both of which have real platform-specific behaviour.
        include:
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 📦 Install test dependencies
        # 📝 The suite imports via `from src.xstate_statemachine import ...`,
        #    so the package does not need to be installed to run tests. It is
        #    installed anyway so an accidental packaging break (missing module,
        #    bad __init__) surfaces here rather than at release time.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          # 🧷 mypy is a TEST dependency: tests/test_type_safety.py runs it
          #    over representative user programs.
          python -m pip install "pytest>=8.3.0" "mypy>=1.14" "pytest-socket>=0.7"

      - name: 🧪 Run test suite
        # 🌐 X0.16 (#303): the default suite must never touch the network.
        #    Loopback is allowed for the CLI's local servers and subprocess
        #    tests; anything else fails the test that attempted it.
        run: pytest -qq --no-header --disable-socket --allow-hosts=127.0.0.1,::1

      - name: 📖 Run doctests
        # 🐛 Regression guard: exceptions.py shipped doctests asserting error
        #    messages that existed nowhere in the codebase. Nothing executed
        #    them, so they rotted silently across releases.
        #
        # ⚠️ These modules use relative imports, so `python -m doctest <file>`
        #    cannot load them ("attempted relative import with no known
        #    parent package"). They must be imported as package members and
        #    handed to `doctest.testmod`.
        run: |
          python -c "
          import doctest, sys
          import xstate_statemachine.exceptions as exceptions
          import xstate_statemachine.models as models

          failures = 0
          for module in (exceptions, models):
              result = doctest.testmod(module, verbose=False)
              print(f'{module.__name__}: {result}')
              failures += result.failed
          sys.exit(1 if failures else 0)
          "

  # ---------------------------------------------------------------------------
  # 📊 Coverage Gate
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 🔌 #306/#266: install every SHIPPED extra so `contrib/` is
          #    MEASURED, not counted as untested zeros. Without this the
          #    total dropped below 90% the moment the first integration
          #    landed, although its own cell was 98% covered. Keep this
          #    list in step with the "shipped" rows of the integrations
          #    guide; placeholder extras stay out (nothing to measure).
          python -m pip install -e ".[redis,pydantic]" "fakeredis[lua]>=2.20"
          # 🧷 mypy is a TEST dependency: tests/test_type_safety.py runs it
          #    over representative user programs.
          python -m pip install "pytest>=8.3.0" "mypy>=1.14" "pytest-cov>=6.0.0"

      - name: 📊 Run suite with coverage
        # 🚧 The threshold is a repository rule: 90% minimum. Raise it when
        #    coverage genuinely improves; never lower it to make a red build
        #    green. The single source of truth is `fail_under` in
        #    `[tool.coverage.report]` (pyproject.toml), so a local
        #    `pytest --cov` enforces the same gate as CI. Measured 90.4% on
        #    3.14 when the rule was set; `branch = true` arc counts differ
        #    slightly across interpreter versions, which is the headroom.
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: 📤 Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 📦 Distribution
  # ---------------------------------------------------------------------------
  build:
    name: Build & verify distribution
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: 📦 Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: 🏗️ Build sdist and wheel
        run: python -m build

      - name: ✅ Validate package metadata
        # 🛡️ Catches malformed README rendering and bad metadata *before* a
        #    release attempt, when the fix is cheap.
        run: twine check dist/*

      - name: 🚬 Smoke-test the built wheel
        # 🏛️ Installing the wheel into a clean venv verifies the *packaged*
        #    artifact, not the source tree. This is what catches a module that
        #    exists on disk but was never included in the wheel.
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --upgrade pip --quiet
          /tmp/smoke/bin/python -m pip install dist/*.whl --quiet
          /tmp/smoke/bin/python -c "
          import xstate_statemachine as x
          from xstate_statemachine import create_machine, MachineLogic, SyncInterpreter
          print('version:', x.__version__)
          m = create_machine(
              {'id': 'ci', 'initial': 'a', 'states': {'a': {'on': {'GO': 'b'}}, 'b': {}}},
              logic=MachineLogic(),
          )
          i = SyncInterpreter(m).start()
          i.send('GO')
          assert i.current_state_ids == {'ci.b'}, i.current_state_ids
          assert i.active_state_ids == {'ci.b'}
          print('smoke test: OK')
          "

      - name: 🖥️ Verify the xsm CLI entry point
        run: |
          /tmp/smoke/bin/xsm --version

      - name: 📤 Upload distribution artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 📏 Integration performance budgets (opt-in; never blocks a pull request)
  # ---------------------------------------------------------------------------
  perf:
    name: Integration performance budgets
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      XSM_PERF: "1"
      XSM_PERF_RUNNER: "ubuntu-24.04"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: 📦 Install the shipped extras and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[redis,pydantic]" "pytest>=8.3.0"

      - name: 📏 Compare measured p50s to recorded budgets
        run: python -m pytest tests/test_perf_budgets.py -q

      - name: 📤 Upload raw performance measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-perf
          path: benchmarks/last_run.json
          if-no-files-found: warn
          retention-days: 30
