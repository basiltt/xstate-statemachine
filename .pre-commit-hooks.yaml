# pre-commit hooks published by xstate-statemachine (#309).
#
#   repos:
#     - repo: https://github.com/basiltt/xstate-statemachine
#       rev: v0.14.0            # any tag that ships this file
#       hooks:
#         - id: xsm-validate
#         - id: xsm-gt-check
#           args: [machines/order.machine.json, -o, generated/, -t, pythonic-class]
#
# `xsm-gt-check` takes the SAME arguments you used to generate the code;
# it writes nothing and fails when the committed files are stale.
- id: xsm-validate
  name: xsm validate (machine JSON)
  description: Build every machine JSON with the real library; fail on errors.
  entry: xsm validate --plain
  language: python
  files: \.machine\.json$|machine\.json$
  types: [json]

- id: xsm-gt-check
  name: xsm gt --check (generated code is current)
  description: >-
    Fail when code generated by `xsm gt` differs from the machine JSON.
    Pass the generation arguments via `args:` (input JSON, -o, -t ...).
  entry: xsm gt --check --plain
  language: python
  pass_filenames: false
  files: \.json$|\.py$
